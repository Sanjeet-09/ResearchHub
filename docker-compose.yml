version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: researchhub-postgres
    environment:
      POSTGRES_DB: researchhub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations/001_init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d researchhub"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
